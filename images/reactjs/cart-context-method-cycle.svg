<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" role="img" aria-labelledby="title desc">
  <title id="title">One feature, one cycle</title>
  <desc id="desc">A three-stage cycle of attention, after Iain McGilchrist, The Master and His Emissary. Right hemisphere: broad, open, ambiguous attention, the feature as a rough draft of the whole idea. Left hemisphere: narrow focus, component tree, then context, then state. Back to the right: it works as a whole and waits for the next feature.</desc>

  <defs>
    <style>
      .bg { fill: #F6F7F9; }
      .board { fill: #FFFFFF; stroke: #E4E7EC; stroke-width: 1.25; }
      .caption { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 400; fill: #6B7380; font-style: italic; }
      .center-kicker { font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #6B7380; }
      .center-title { font-family: Inter, system-ui, sans-serif; font-size: 16.5px; font-weight: 650; fill: #1A2130; }
      .stage-title { font-family: Inter, system-ui, sans-serif; font-size: 16.5px; font-weight: 700; }
      .stage-body { font-family: Inter, system-ui, sans-serif; font-size: 13.25px; font-weight: 450; }
      .stage-num { font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    </style>

    <clipPath id="card-clip">
      <rect x="0" y="0" width="248" height="220" rx="18"/>
    </clipPath>

    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="soft-blur-lite" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1A2130" flood-opacity="0.12"/>
    </filter>
    <filter id="centre-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1A2130" flood-opacity="0.10"/>
    </filter>

    <radialGradient id="blob-a" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFC078"/>
      <stop offset="100%" stop-color="#E85D04"/>
    </radialGradient>
    <radialGradient id="blob-b" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FF8FBF"/>
      <stop offset="100%" stop-color="#D6246E"/>
    </radialGradient>
    <radialGradient id="blob-c" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#F4A259"/>
    </radialGradient>
    <linearGradient id="warm-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7F0"/>
      <stop offset="100%" stop-color="#FDE6D0"/>
    </linearGradient>
    <linearGradient id="cool-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FAF8"/>
      <stop offset="100%" stop-color="#D5EEEA"/>
    </linearGradient>
    <linearGradient id="green-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2FAF4"/>
      <stop offset="100%" stop-color="#D8F0DD"/>
    </linearGradient>
    <linearGradient id="warm-num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F07C2A"/>
      <stop offset="100%" stop-color="#D6246E"/>
    </linearGradient>
    <linearGradient id="cool-num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A9B8E"/>
      <stop offset="100%" stop-color="#0F6B5C"/>
    </linearGradient>
    <linearGradient id="green-num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CB86D"/>
      <stop offset="100%" stop-color="#2D8A46"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="900" height="820"/>
  <rect class="board" x="16" y="16" width="868" height="788" rx="22"/>

  <circle cx="450" cy="422" r="278" fill="none" stroke="#EEF0F3" stroke-width="8"/>

  <g filter="url(#card-shadow)" transform="translate(326.00 34.00)">
    <rect x="0" y="0" width="248" height="220" rx="18" fill="url(#warm-card)" stroke="#F0B27A" stroke-width="1.4"/>
    <g clip-path="url(#card-clip)">
    <circle cx="28" cy="26" r="13" fill="url(#warm-num)"/>
    <text class="stage-num" x="28" y="30.5" text-anchor="middle">1</text>
    <g transform="translate(180 6)">
      <g filter="url(#soft-blur)" opacity="0.95">
        <ellipse cx="24" cy="22" rx="18" ry="14" fill="url(#blob-b)"/>
        <ellipse cx="38" cy="20" rx="14" ry="13" fill="url(#blob-a)"/>
        <ellipse cx="28" cy="28" rx="12" ry="9" fill="url(#blob-c)"/>
      </g>
      <g filter="url(#soft-blur-lite)" opacity="0.85">
        <circle cx="16" cy="14" r="6" fill="#FFD8A8"/>
      </g>
    </g>
    <text class="stage-title" x="18" y="76" fill="#B03A1A">Right hemisphere</text>
    <text class="stage-body" x="18" y="102" fill="#5C3A28">Broad, open, ambiguous</text>
    <text class="stage-body" x="18" y="121" fill="#5C3A28">attention.</text>
    <text class="stage-body" x="18" y="140" fill="#5C3A28">A rough draft of the</text>
    <text class="stage-body" x="18" y="159" fill="#5C3A28">whole idea.</text>
    </g>
  </g>

  <g filter="url(#card-shadow)" transform="translate(566.76 451.00)">
    <rect x="0" y="0" width="248" height="220" rx="18" fill="url(#cool-card)" stroke="#8DC4BD" stroke-width="1.4"/>
    <g clip-path="url(#card-clip)">
    <circle cx="28" cy="26" r="13" fill="url(#cool-num)"/>
    <text class="stage-num" x="28" y="30.5" text-anchor="middle">2</text>
    <g transform="translate(178 4)" stroke="#0F6B5C" stroke-width="1.5" fill="#0F6B5C">
      <line x1="32" y1="16" x2="18" y2="28" stroke-linecap="round"/>
      <line x1="32" y1="16" x2="46" y2="28" stroke-linecap="round"/>
      <line x1="18" y1="34" x2="12" y2="44" stroke-linecap="round"/>
      <line x1="18" y1="34" x2="24" y2="44" stroke-linecap="round"/>
      <rect x="22" y="6" width="20" height="11" rx="2.2" fill="#0F6B5C" stroke="none"/>
      <rect x="9" y="27" width="18" height="9" rx="1.8" fill="#1A9B8E" stroke="none"/>
      <rect x="37" y="27" width="18" height="9" rx="1.8" fill="#E8F7F5" stroke="#0F6B5C"/>
      <rect x="4" y="43" width="13" height="8" rx="1.6" fill="#0F6B5C" stroke="none"/>
      <rect x="19" y="43" width="13" height="8" rx="1.6" fill="#E8F7F5" stroke="#0F6B5C"/>
    </g>
    <text class="stage-title" x="18" y="76" fill="#0F5B50">Left hemisphere</text>
    <text class="stage-body" x="18" y="102" fill="#1E3F3A">Narrow focus.</text>
    <text class="stage-body" x="18" y="121" fill="#1E3F3A">Component tree, then</text>
    <text class="stage-body" x="18" y="140" fill="#1E3F3A">context, then state.</text>
    </g>
  </g>

  <g filter="url(#card-shadow)" transform="translate(85.24 451.00)">
    <rect x="0" y="0" width="248" height="220" rx="18" fill="url(#green-card)" stroke="#97C9A3" stroke-width="1.4"/>
    <g clip-path="url(#card-clip)">
    <circle cx="28" cy="26" r="13" fill="url(#green-num)"/>
    <text class="stage-num" x="28" y="30.5" text-anchor="middle">3</text>
    <g transform="translate(186 6)">
      <circle cx="24" cy="22" r="18" fill="#2F9A4A"/>
      <circle cx="24" cy="22" r="13" fill="#E8F8EC"/>
      <path d="M 17 22.5 L 22 27.5 L 32 17" fill="none" stroke="#2D8A46" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="stage-title" x="18" y="76" fill="#1E6B38">Back to the right</text>
    <text class="stage-body" x="18" y="102" fill="#1E3F2A">It works as a whole.</text>
    <text class="stage-body" x="18" y="121" fill="#1E3F2A">Waiting for the</text>
    <text class="stage-body" x="18" y="140" fill="#1E3F2A">next feature.</text>
    </g>
  </g>

  <g filter="url(#centre-shadow)">
    <circle cx="450" cy="422" r="84" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="1.25"/>
  </g>
  <circle cx="450" cy="422" r="76" fill="none" stroke="#EEE7E0" stroke-width="1.25" stroke-dasharray="3.5 5"/>
  <text class="center-kicker" x="450" y="410" text-anchor="middle">ONE FEATURE</text>
  <text class="center-title" x="450" y="438" text-anchor="middle">one cycle</text>

  <path d="M 628.69 209.04 A 278 278 0 0 1 726.48 392.94" fill="none" stroke="#1A9B8E" stroke-width="6" stroke-linecap="round"/>
  <polygon points="727.83,412.30 718.65,398.81 736.04,398.20" fill="#1A9B8E"/>
  <path d="M 526.63 689.23 A 278 278 0 0 1 382.75 691.74" fill="none" stroke="#2F9A4A" stroke-width="6" stroke-linecap="round"/>
  <polygon points="364.09,686.39 379.91,682.38 374.53,698.93" fill="#2F9A4A"/>
  <path d="M 180.26 354.75 A 278 278 0 0 1 263.98 215.41" fill="none" stroke="#E86A2C" stroke-width="6" stroke-linecap="round"/>
  <polygon points="278.85,202.93 273.33,218.28 262.62,204.57" fill="#E86A2C"/>
  <text class="caption" x="450" y="790" text-anchor="middle">Iain McGilchrist, The Master and His Emissary</text>
</svg>
