<title>Fullstack mind map</title>
<style>
body{margin:0;background:radial-gradient(circle at 50% 45%,#1e293b,#0b1020 70%);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin:10px 0 0}
svg{width:100%;max-width:2360px;height:auto}
.link{opacity:.55;stroke-dasharray:6 6;animation:flow 30s linear infinite}
.link.main{opacity:.85;stroke-dasharray:none}
.link.cross{opacity:.4;stroke-dasharray:3 7;animation:flow 40s linear infinite}
@keyframes flow{to{stroke-dashoffset:-300}}
.node rect{fill:color-mix(in srgb,var(--c) 18%,#0f172a);stroke:var(--c);stroke-width:2;transition:.25s}
.node text{text-anchor:middle;fill:#f8fafc;font-size:14px;pointer-events:none}
.node.main rect{stroke-width:3;filter:drop-shadow(0 0 10px var(--c))}
.node.main text{font-size:18px;font-weight:700}
.node.twoline text{font-size:14px;font-weight:700}
.node.twoline text.sublabel{font-size:10px;font-weight:500}
.node.sub rect{stroke-width:1.5}
.node.sub text{font-size:11px}
.node.subsub rect{stroke-width:1.2}
.node.subsub text{font-size:10px}
.node.root rect{fill:#f8fafc;stroke:#f8fafc;filter:drop-shadow(0 0 18px #94a3b8)}
.node.root text{fill:#0f172a;font-size:22px;font-weight:800;letter-spacing:.08em}
.node{cursor:default}
.node:hover rect{fill:var(--c)}
.node:hover text{fill:#0f172a}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:4px 0 12px;font-size:.85rem}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
@media (prefers-reduced-motion:reduce){.link{animation:none}}
</style>
